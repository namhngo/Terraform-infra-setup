# This workflow lives inside the project so the directory can move to a
# standalone repository without changing its checks. GitHub does not execute
# nested workflows while this project is inside the parent repository; the
# same commands remain available locally through the Makefile.

name: terraform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-site

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init (no backend)
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: tflint
